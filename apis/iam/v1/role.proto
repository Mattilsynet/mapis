syntax = "proto3";
package iam.v1;

import "buf/validate/validate.proto";
import "meta/v1/meta.proto";
import "status/v1/status.proto";

option go_package = "github.com/Mattilsynet/mapis/gen/go/iam/v1;iamv1";

// Role - defines a set of permissions (flat namespace)
// Roles are granted via Policy bindings
// metadata.name = role name
message Role {
  meta.v1.TypeMeta type = 1;
  meta.v1.ObjectMeta metadata = 2;  // name = role_name
  RoleSpec spec = 20;
  RoleStatus status = 30;
}

message RoleSpec {
  // name - role name (matches metadata.name)
  string name = 1 [(buf.validate.field).string.min_len = 1];

  // description - human-readable description
  string description = 2;

  // permissions - list of permission identifiers referenced by this role.
  // Canonical IAM permission names use dotted action notation (for example
  // "iam.role.read", "iam.rolebinding.create", "dns.zone.update").
  repeated string permissions = 10 [(buf.validate.field).string.min_len = 1];

  // external_id - ZITADEL role ID (populated during sync)
  string external_id = 20;

  // is_builtin - if true, this is a system-provided role
  bool is_builtin = 30;

  // bindability controls which principal classes may bind this role.
  // UNSPECIFIED defaults to TENANT_BINDABLE for backward compatibility.
  RoleBindability bindability = 31 [(buf.validate.field).enum.defined_only = true];
}

enum RoleBindability {
  ROLE_BINDABILITY_UNSPECIFIED = 0;
  ROLE_BINDABILITY_TENANT_BINDABLE = 1;
  ROLE_BINDABILITY_INTERNAL_ONLY = 2;
}

message RoleStatus {
  status.v1.Status status = 20;
}

message RoleList {
  repeated Role items = 1;
}
