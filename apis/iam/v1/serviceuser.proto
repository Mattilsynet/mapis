syntax = "proto3";
package iam.v1;

import "buf/validate/validate.proto";
import "meta/v1/meta.proto";
import "status/v1/status.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/Mattilsynet/mapis/gen/go/iam/v1;iamv1";

// ServiceUser - a machine identity for API access
// metadata.name = service user principal name (global unique)
// Format: "serviceuser@{org}.{domain}" (e.g., "serviceuser@acme.example.com")
message ServiceUser {
  meta.v1.TypeMeta type = 1;
  meta.v1.ObjectMeta metadata = 2;
  ServiceUserSpec spec = 20;
  ServiceUserStatus status = 30;
}

message ServiceUserSpec {
  // name - service user principal name (global unique)
  // Format: "serviceuser@{org}.{domain}" (e.g., "serviceuser@acme.example.com")
  // Org must be lowercase DNS label (max 63 chars), domain can be any valid format
  string name = 1 [(buf.validate.field).string.min_len = 1];
  
  // description - human-readable description
  string description = 2;
  
  // display_name - optional friendly name for UI display
  // If not provided, defaults to the principal name
  string display_name = 3;
  
  // is_active - if false, the service user is disabled
  bool is_active = 4;

  // owner marks system-managed service users and their reconciler ownership.
  ServiceUserOwner owner = 30;

  // mutation_policy controls whether non-trusted callers may mutate this
  // service user.
  ServiceUserMutationPolicy mutation_policy = 31 [(buf.validate.field).enum.defined_only = true];
}

message ServiceUserOwner {
  // owner_ref identifies the owning resource identity, e.g.
  // project/{org}/{project}/projectserviceactivation/{service}.
  string owner_ref = 1;

  // managed_by identifies the reconciler/controller owning lifecycle.
  string managed_by = 2;
}

enum ServiceUserMutationPolicy {
  SERVICE_USER_MUTATION_POLICY_UNSPECIFIED = 0;
  SERVICE_USER_MUTATION_POLICY_MUTABLE = 1;
  SERVICE_USER_MUTATION_POLICY_IMMUTABLE = 2;
}

message ServiceUserStatus {
  status.v1.Status status = 20;
  
  // zitadel_id - ZITADEL service user ID (populated during sync)
  string zitadel_id = 21;
  
  // last_active - last time this service user was used
  google.protobuf.Timestamp last_active = 22;

  // pat_credential stores the Keyhole-wrapped PAT ciphertext and the metadata
  // required to address the Keyhole wrapping key. Plaintext PAT material and
  // Keyhole wrapping keys are never persisted in this resource.
  ServiceUserPATCredential pat_credential = 23;
}

message ServiceUserPATCredential {
  string token_id = 1;
  bytes ciphertext = 2;
  string subsystem = 3;
  string kind = 4;
  string resource_id = 5;
  string organization_id = 6;
  string project_id = 7;
  string zitadel_id = 8;
  google.protobuf.Timestamp expires_at = 9;
  google.protobuf.Timestamp minted_at = 10;
}

message ServiceUserList {
  repeated ServiceUser items = 1;
}
