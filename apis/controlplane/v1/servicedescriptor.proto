syntax = "proto3";

package controlplane.v1;

import "buf/validate/validate.proto";
import "iam/v1/permission.proto";
import "iam/v1/rolebinding.proto";
import "iam/v1/role.proto";
import "meta/v1/meta.proto";
import "status/v1/status.proto";

option go_package = "github.com/Mattilsynet/mapis/gen/go/controlplane/v1;controlplanev1";

// ServiceDescriptor is the declarative source for platform service metadata
// and built-in IAM declarations for a service.
//
// Reconciliation ownership:
// - ServiceDescriptor reconciler projects declarations into IAM dataplane.
// - Method-to-permission mapping remains in service/runtime code.
message ServiceDescriptor {
  meta.v1.TypeMeta type = 1;
  meta.v1.ObjectMeta metadata = 2;
  ServiceDescriptorSpec spec = 20;
  ServiceDescriptorStatus status = 30;
}

message ServiceDescriptorSpec {
  // service_name is the canonical service namespace.
  string service_name = 1 [(buf.validate.field).string = {
    min_len: 1,
    pattern: "^[a-z][a-z0-9-]*$"
  }];

  string display_name = 2;
  string description = 3;

  // service_visibility controls whether this service is tenant-discoverable.
  // UNSPECIFIED defaults to PUBLIC for backward compatibility.
  ServiceVisibility service_visibility = 4 [(buf.validate.field).enum.defined_only = true];

  // service_activation_mode declares whether this service is always enabled or
  // project-selectable.
  // UNSPECIFIED defaults to BUILTIN_ALWAYS_ON for backward compatibility.
  ServiceActivationMode service_activation_mode = 5 [(buf.validate.field).enum.defined_only = true];

  repeated ResourceKindDescriptor resource_kinds = 10;

  // declared_permissions embeds IAM permission declarations for this service.
  //
  // Input contract:
  // - accepted in lenient form and normalized by reconciler
  // - canonical semantic permission name remains dotted in spec.name
  // - invalid declarations are rejected during validation/reconciliation
  // - these declarations are treated as built-in platform permissions
  repeated iam.v1.Permission declared_permissions = 20;

  // built_in_roles embeds IAM built-in role declarations for this service.
  //
  // Input contract:
  // - accepted in lenient form and normalized by reconciler
  // - role permission references must resolve to canonical permission names
  // - invalid references are rejected during reconciliation
  // - these roles are treated as built-in platform roles
  repeated iam.v1.Role built_in_roles = 30;

  // built_in_role_templates declares built-in role intent using permission
  // filters and explicit permission names.
  repeated BuiltInRoleTemplate built_in_role_templates = 31;

  // built_in_permission_filters declares reusable permission filters that role
  // templates may reference by name.
  repeated BuiltInPermissionFilter built_in_permission_filters = 32;

  // built_in_role_bindings declares built-in rolebinding intent for managed
  // defaults projected by reconciler.
  repeated BuiltInRoleBinding built_in_role_bindings = 33;

  // activation_runtime_role_names declares the internal-only roles granted to
  // the deterministic runtime ServiceUser created for each project activation
  // of this service. The activation reconciler expands these names into
  // immutable, project-scoped RoleBindings. This is runtime dependency access,
  // not a grant of this service's tenant-facing roles.
  repeated string activation_runtime_role_names = 34;

  // v1 supports only APPLY semantics.
  // APPLY is authoritative desired-state reconciliation for descriptor-owned
  // built-in permissions and roles:
  // - upsert entries present in descriptor
  // - prune previously projected descriptor-owned entries that are now absent
  ReconciliationMode mode = 40 [(buf.validate.field).enum = {
    defined_only: true,
    in: [1]
  }];

  // provenance describes where this descriptor came from and whether it is a
  // virtual/generated platform descriptor.
  ServiceDescriptorProvenance provenance = 50;
}

enum ServiceVisibility {
  SERVICE_VISIBILITY_UNSPECIFIED = 0;
  SERVICE_VISIBILITY_PUBLIC = 1;
  SERVICE_VISIBILITY_INTERNAL = 2;
}

enum ServiceActivationMode {
  SERVICE_ACTIVATION_MODE_UNSPECIFIED = 0;
  SERVICE_ACTIVATION_MODE_BUILTIN_ALWAYS_ON = 1;
  SERVICE_ACTIVATION_MODE_OPTIONAL_PROJECT_SELECTABLE = 2;
}

enum ServiceDescriptorOrigin {
  SERVICE_DESCRIPTOR_ORIGIN_UNSPECIFIED = 0;
  SERVICE_DESCRIPTOR_ORIGIN_DECLARED = 1;
  SERVICE_DESCRIPTOR_ORIGIN_SYNCED_FROM_IAM = 2;
  SERVICE_DESCRIPTOR_ORIGIN_GENERATED = 3;
}

message ServiceDescriptorProvenance {
  ServiceDescriptorOrigin origin = 1 [(buf.validate.field).enum.defined_only = true];

  bool virtual_descriptor = 2;

  string generator_id = 3 [(buf.validate.field).string = {
    min_len: 1,
    pattern: "^[a-z][a-z0-9-]*$"
  }];

  repeated string input_refs = 4;
}

message BuiltInRoleTemplate {
  string role_name = 1 [(buf.validate.field).string = {
    min_len: 1,
    pattern: "^[a-z][a-z0-9-]*$"
  }];

  string display_name = 2;
  string description = 3;

  // Inline filters. Multiple filters are unioned during materialization.
  repeated BuiltInPermissionFilter permission_filters = 10;

  // References to named filters from spec.built_in_permission_filters.
  repeated string permission_filter_names = 11;

  // bindability controls who may bind this role at runtime.
  iam.v1.RoleBindability bindability = 12 [(buf.validate.field).enum.defined_only = true];
}

message BuiltInRoleBinding {
  // rolebinding_name is optional explicit canonical name override.
  string rolebinding_name = 1;

  string resource_id = 2;

  string role = 3;

  repeated string members = 10;

  iam.v1.RoleBindingMutationPolicy mutation_policy = 20 [(buf.validate.field).enum.defined_only = true];
}

message BuiltInPermissionFilter {
  // name is used when declaring reusable filters at descriptor scope.
  // Inline filters may omit this field.
  string name = 1;

  // Canonical permission names, e.g. iam.users.create.
  repeated string permission_names = 2;

  repeated string service_names = 3;

  repeated string resource_types = 4;
  repeated string actions = 5;
  repeated string group_names = 6;
}

enum ResourceScope {
  RESOURCE_SCOPE_UNSPECIFIED = 0;
  RESOURCE_SCOPE_GLOBAL = 1;
  RESOURCE_SCOPE_ORG = 2;
  RESOURCE_SCOPE_PROJECT = 3;
}

message ResourceKindDescriptor {
  // type is singular kind name used in resource type identity: {service}/{version}/{type}
  string type = 1 [(buf.validate.field).string = {
    min_len: 1,
    pattern: "^[a-z][a-z0-9-]*$"
  }];

  // plural is the canonical plural form used in permission names.
  string plural = 2 [(buf.validate.field).string = {
    min_len: 1,
    pattern: "^[a-z][a-z0-9-]*$"
  }];

  // version is the canonical API version for this kind within the service.
  string version = 7 [(buf.validate.field).string = {
    min_len: 1,
    pattern: "^[a-z][a-z0-9-]*$"
  }];

  ResourceScope scope = 3 [(buf.validate.field).enum.defined_only = true];

  bool is_regional = 4;

  // regex used to validate the resource ID segment in FQRN.
  string id_pattern = 5 [(buf.validate.field).string.min_len = 1];

  // aligns with optimistic concurrency ADR capabilities by kind.
  bool supports_resource_version = 6;
}

enum ReconciliationMode {
  RECONCILIATION_MODE_UNSPECIFIED = 0;
  // APPLY is authoritative desired-state reconciliation.
  RECONCILIATION_MODE_APPLY = 1;
}

message ServiceDescriptorStatus {
  status.v1.Status status = 1;
}

message ServiceDescriptorList {
  repeated ServiceDescriptor items = 1;
}
