syntax = "proto3";

package dns.v1;

import "buf/validate/validate.proto";
import "meta/v1/meta.proto";
import "status/v1/status.proto";

option go_package = "github.com/Mattilsynet/mapis/gen/go/dns/v1;dnsv1";

message Delegation {
  meta.v1.TypeMeta type = 1;
  meta.v1.ObjectMeta metadata = 2;
  DelegationSpec spec = 20;
  DelegationStatus status = 30;
}

message DelegationSpec {
  string resource_id = 1 [(buf.validate.field).string.min_len = 1];
  string parent_zone_ref = 2 [(buf.validate.field).string.min_len = 1];
  string child_fqdn = 3 [(buf.validate.field).string.min_len = 1];
  repeated string nameservers = 4;
  repeated string glue_ipv4 = 5;
  repeated string glue_ipv6 = 6;
}

message DelegationStatus {
  status.v1.Status status = 1;
}

message DelegationList {
  repeated Delegation items = 1;
}
