syntax = "proto3";

package secret.v1;

import "meta/v1/meta.proto";
import "status/v1/status.proto";

option go_package = "github.com/Mattilsynet/mapis/gen/go/secret/v1;secret";

// Secret is a project-scoped identity + metadata resource holding a pointer
// to the active version of a secret value. Plaintext and ciphertext never
// reside on this resource; they live on immutable SecretValue version records.
message Secret {
  meta.v1.TypeMeta type = 1;
  meta.v1.ObjectMeta metadata = 10;
  SecretSpec spec = 20;
  SecretStatus status = 30;
}

message SecretSpec {
  reserved 1, 2, 3, 4;
  reserved "organization_id", "project_id", "secret_id", "display_name";
  // description is the only desired-state field on a Secret. Identity is carried
  // exclusively by metadata.name and metadata.fqrn.
  string description = 5;
  // initial_value is accepted only on Secret CREATE and is immediately moved
  // into the first immutable SecretValue version. It is never persisted on the
  // parent Secret or returned by GET/LIST/events.
  bytes initial_value = 6;
}

message SecretStatus {
  // current_version is the highest immutable SecretValue version linked to this Secret.
  int64 current_version = 1;
  int64 total_versions = 2;
  status.v1.Status status = 3;
}

// SecretList carries index-only entries. It MUST NOT include full metadata,
// spec or status of the underlying Secret resources.
message SecretList {
  repeated SecretIndexItem items = 1;
}

// SecretIndexItem is the safe index-level view of a Secret returned by LIST.
message SecretIndexItem {
  string name = 1;
  string project = 2;
  string secret_id = 3;
  string resource_version = 4;
  string created_at = 5;
  string updated_at = 6;
  map<string, string> labels = 7;
}

// SecretValue is an immutable encrypted child resource of a Secret. CREATE
// supplies spec.parent_fqrn; the domain allocates metadata.name and the
// hierarchical metadata.fqrn for the new child.
message SecretValue {
  meta.v1.TypeMeta type = 1;
  meta.v1.ObjectMeta metadata = 10;
  SecretValueSpec spec = 20;
  SecretValueStatus status = 30;
}

message SecretValueSpec {
  reserved 1, 2, 3, 4, 7;
  reserved "organization_id", "project_id", "secret_id", "version", "plaintext";
  // algorithm names the crypto scheme used to persist this value. age-hybrid is
  // the only allowed value for new writes.
  string algorithm = 5;
  // key_refs are project-scoped key references used to encrypt this value via keyhole.
  repeated string key_refs = 6;
  // ciphertext is the locally encrypted payload blob for this version record
  // (nonce || ciphertext) produced by the secret domain's data-encryption-key
  // (DEK) envelope flow. It is created on write and persisted; it is never
  // returned to callers on GET.
  bytes ciphertext = 8;
  // wrapped_dek is the keyhole-wrapped DEK ciphertext used to decrypt
  // ciphertext. It is persisted alongside ciphertext but never returned to
  // callers in read/list responses.
  bytes wrapped_dek = 9;
  // parent_fqrn identifies the parent Secret, e.g.
  // secret/{org}/{project}/secret/{name}. The relationship is persisted and
  // returned on reads; only cryptographic fields are redacted.
  string parent_fqrn = 10;
  // write_value is accepted only on SecretValue CREATE. The Secret domain
  // wraps it before persistence and clears it from stored resources, GET/LIST
  // responses, and events. It must never be used for an UPDATE because value
  // versions are immutable.
  bytes write_value = 11;
  // wrapped_value is the Keyhole ciphertext for this immutable version. It is
  // persisted by the Secret domain and never returned by GET/LIST/events.
  bytes wrapped_value = 12;
}

message SecretValueStatus {
  status.v1.Status status = 1;
}

// SecretValueList carries index-only entries. It MUST NOT include full metadata,
// spec (including plaintext) or status of the underlying SecretValue resources.
message SecretValueList {
  repeated SecretValueIndexItem items = 1;
}

// SecretValueIndexItem is the safe index-level view of a SecretValue returned by LIST.
message SecretValueIndexItem {
  string name = 1;
  string project = 2;
  string secret_id = 3;
  int64 version = 4;
  string resource_version = 5;
  string created_at = 6;
  map<string, string> labels = 7;
}
